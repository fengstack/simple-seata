# simple-seata 配置（HOCON 格式，Typesafe Config 读取）
# 客户端唯一必需的配置：事务分组 -> TC 地址。生产版 Seata 在这里接注册中心。

service {
  # 事务分组 my_test_tx_group 映射到集群名 default
  vgroup_mapping.my_test_tx_group = "default"
  # default 集群的 TC 节点列表（教学实现单节点）
  default.grouplist = "127.0.0.1:8091"
}

client {
  # AsyncWorker 二阶段批量删 undo_log 的队列上限
  async.commit.buffer.limit = 10000
  # 全局锁冲突时的重试间隔(ms)与重试次数
  lock.retry.interval = 10
  lock.retry.times = 10
}
